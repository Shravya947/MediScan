<style>
:root{--bg:#F4F8F7;--card:#fff;--ink:#12302F;--mut:#5B7170;--pri:#0E6B66;--onpri:#fff;--line:#D5E3E1;--warn:#FFF1CC;--warnb:#C98A00;--bad:#FCE0DC;--badb:#B3261E;--ok:#DDF3E6;--okb:#1E7A46;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1A19;--card:#16282A;--ink:#E6F2F0;--mut:#9DB5B2;--pri:#4FC3BA;--onpri:#06201E;--line:#27413F;--warn:#3A3016;--warnb:#E8B93C;--bad:#3F1D1A;--badb:#FF8A80;--ok:#16372A;--okb:#6FD9A0}}
:root[data-theme="dark"]{--bg:#0E1A19;--card:#16282A;--ink:#E6F2F0;--mut:#9DB5B2;--pri:#4FC3BA;--onpri:#06201E;--line:#27413F;--warn:#3A3016;--warnb:#E8B93C;--bad:#3F1D1A;--badb:#FF8A80;--ok:#16372A;--okb:#6FD9A0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;color:var(--pri)}
select,input,button{font:inherit;color:inherit}
select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
main{flex:1;overflow-y:auto;padding:16px}
nav{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav button{flex:1;padding:14px 4px;background:none;border:0;font-weight:700;color:var(--mut)}
nav button.on{color:var(--pri);box-shadow:inset 0 3px 0 var(--pri)}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:14px;padding:14px 18px;font-weight:700;width:100%}
.btn.alt{background:none;color:var(--pri);border:2px solid var(--pri)}
.row{display:flex;gap:8px;margin:10px 0}
input{flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px}
video{width:100%;border-radius:14px;background:#000;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card h3{margin:0 0 4px;font-size:17px;color:var(--pri)}
.card p{margin:0}
.top{display:flex;gap:14px;align-items:center}
.pill{font-size:46px;width:76px;height:76px;border-radius:50%;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;flex:none}
.top h2{margin:0;font-size:21px}
.alert{border-left:6px solid;border-radius:10px;padding:10px 12px;margin:12px 0;font-weight:700}
.alert.w{background:var(--warn);border-color:var(--warnb)}.alert.b{background:var(--bad);border-color:var(--badb)}.alert.o{background:var(--ok);border-color:var(--okb)}
.mut{color:var(--mut);font-size:14px}
.hide{display:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
</style></head><body>

const DB=[{"id":"para","c":"8901000000011","n":"Paracetamol 500 mg","e":"🟡","rx":false,"u":{"en":"Fever and mild to moderate pain such as headache or body ache.","hi":"बुखार और हल्का से मध्यम दर्द, जैसे सिरदर्द या बदन दर्द।","kn":"ಜ್ವರ ಮತ್ತು ತಲೆನೋವು, ಮೈಕೈ ನೋವಿನಂತಹ ಸೌಮ್ಯ ನೋವು."},"s":{"en":"Rare at normal doses. Too much can damage the liver. Avoid alcohol.","hi":"सामान्य खुराक में कम। ज़्यादा लेने से लिवर को नुकसान। शराब से बचें।","kn":"ಸಾಮಾನ್ಯ ಪ್ರಮಾಣದಲ್ಲಿ ಅಪರೂಪ. ಹೆಚ್ಚು ಸೇವನೆ ಯಕೃತ್ತಿಗೆ ಹಾನಿ. ಮದ್ಯ ಬೇಡ."},"d":{"en":"Adults: 1 tablet every 4 to 6 hours if needed. Never more than 4 g (8 tablets) in 24 hours.","hi":"वयस्क: ज़रूरत हो तो हर 4 से 6 घंटे में 1 गोली। 24 घंटे में 4 ग्राम (8 गोली) से ज़्यादा नहीं।","kn":"ವಯಸ್ಕರು: ಅಗತ್ಯವಿದ್ದರೆ 4–6 ಗಂಟೆಗೆ 1 ಮಾತ್ರೆ. 24 ಗಂಟೆಯಲ್ಲಿ 4 ಗ್ರಾಂ (8 ಮಾತ್ರೆ) ಮೀರಬಾರದು."}},{"id":"ibu","c":"8901000000028","n":"Ibuprofen 400 mg","e":"🟠","rx":false,"u":{"en":"Pain, inflammation and fever, such as toothache or joint pain.","hi":"दर्द, सूजन और बुखार, जैसे दाँत या जोड़ों का दर्द।","kn":"ಹಲ್ಲುನೋವು, ಕೀಲುನೋವು, ಊತ ಮತ್ತು ಜ್ವರ."},"s":{"en":"Stomach pain, acidity, nausea. Can harm kidneys or stomach with long use.","hi":"पेट दर्द, एसिडिटी, मिचली। लंबे उपयोग से किडनी या पेट को नुकसान।","kn":"ಹೊಟ್ಟೆನೋವು, ಆಮ್ಲೀಯತೆ, ವಾಕರಿಕೆ. ದೀರ್ಘಕಾಲ ಬಳಸಿದರೆ ಕಿಡ್ನಿ ಅಥವಾ ಹೊಟ್ಟೆಗೆ ಹಾನಿ."},"d":{"en":"Adults: 1 tablet up to 3 times a day, after food. Short-term use only.","hi":"वयस्क: खाने के बाद दिन में 3 बार तक 1 गोली। केवल थोड़े समय के लिए।","kn":"ವಯಸ್ಕರು: ಊಟದ ನಂತರ ದಿನಕ್ಕೆ ಗರಿಷ್ಠ 3 ಬಾರಿ 1 ಮಾತ್ರೆ. ಅಲ್ಪಕಾಲ ಮಾತ್ರ."}},{"id":"cet","c":"8901000000035","n":"Cetirizine 10 mg","e":"⚪","rx":false,"u":{"en":"Allergy, sneezing, runny nose, itchy skin.","hi":"एलर्जी, छींक, बहती नाक, खुजली।","kn":"ಅಲರ್ಜಿ, ಸೀನು, ಮೂಗು ಸೋರುವಿಕೆ, ತುರಿಕೆ."},"s":{"en":"Drowsiness, dry mouth. Be careful when driving.","hi":"नींद आना, मुँह सूखना। गाड़ी चलाते समय सावधान रहें।","kn":"ನಿದ್ರೆ, ಬಾಯಿ ಒಣಗುವುದು. ವಾಹನ ಚಾಲನೆಯಲ್ಲಿ ಎಚ್ಚರಿಕೆ."},"d":{"en":"Adults: 1 tablet once a day, preferably at night.","hi":"वयस्क: दिन में एक बार 1 गोली, बेहतर है रात को।","kn":"ವಯಸ್ಕರು: ದಿನಕ್ಕೆ ಒಂದು ಬಾರಿ 1 ಮಾತ್ರೆ, ರಾತ್ರಿ ಉತ್ತಮ."}},{"id":"pan","c":"8901000000042","n":"Pantoprazole 40 mg","e":"🔵","rx":false,"u":{"en":"Acidity, heartburn and stomach ulcers.","hi":"एसिडिटी, सीने में जलन और पेट के छाले।","kn":"ಆಮ್ಲೀಯತೆ, ಎದೆ ಉರಿ ಮತ್ತು ಹೊಟ್ಟೆ ಹುಣ್ಣು."},"s":{"en":"Headache, loose stools, gas. Long use may lower vitamin B12.","hi":"सिरदर्द, दस्त, गैस। लंबे उपयोग से विटामिन B12 कम हो सकता है।","kn":"ತಲೆನೋವು, ಭೇದಿ, ಗ್ಯಾಸ್. ದೀರ್ಘಕಾಲ ಬಳಸಿದರೆ ವಿಟಮಿನ್ B12 ಕಡಿಮೆಯಾಗಬಹುದು."},"d":{"en":"Adults: 1 tablet once a day, 30 minutes before breakfast, or as your doctor says.","hi":"वयस्क: दिन में एक बार नाश्ते से 30 मिनट पहले 1 गोली, या डॉक्टर के अनुसार।","kn":"ವಯಸ್ಕರು: ತಿಂಡಿಗೆ 30 ನಿಮಿಷ ಮೊದಲು ದಿನಕ್ಕೆ 1 ಮಾತ್ರೆ, ಅಥವಾ ವೈದ್ಯರ ಸೂಚನೆಯಂತೆ."}},{"id":"asp","c":"8901000000059","n":"Aspirin 75 mg","e":"🔴","rx":false,"u":{"en":"Low-dose use to help prevent heart attack and stroke, when advised by a doctor.","hi":"डॉक्टर की सलाह पर हार्ट अटैक और स्ट्रोक रोकने के लिए कम खुराक।","kn":"ವೈದ್ಯರ ಸಲಹೆಯಂತೆ ಹೃದಯಾಘಾತ ಮತ್ತು ಪಾರ್ಶ್ವವಾಯು ತಡೆಗೆ ಕಡಿಮೆ ಪ್ರಮಾಣ."},"s":{"en":"Stomach upset, easy bruising or bleeding.","hi":"पेट में गड़बड़ी, आसानी से नील पड़ना या खून बहना।","kn":"ಹೊಟ್ಟೆ ಕಿರಿಕಿರಿ, ಸುಲಭವಾಗಿ ಬಾಸುಂಡೆ ಅಥವಾ ರಕ್ತಸ್ರಾವ."},"d":{"en":"1 tablet once a day after food, only as prescribed.","hi":"खाने के बाद दिन में एक बार 1 गोली, केवल डॉक्टर के कहने पर।","kn":"ಊಟದ ನಂತರ ದಿನಕ್ಕೆ ಒಂದು ಬಾರಿ 1 ಮಾತ್ರೆ, ವೈದ್ಯರ ಸೂಚನೆಯಂತೆ ಮಾತ್ರ."}},{"id":"lor","c":"8901000000066","n":"Loratadine 10 mg","e":"🟡","rx":false,"u":{"en":"Allergy: sneezing, runny nose, itchy eyes or skin.","hi":"एलर्जी: छींक, बहती नाक, खुजली।","kn":"ಅಲರ್ಜಿ: ಸೀನು, ಮೂಗು ಸೋರುವಿಕೆ, ತುರಿಕೆ."},"s":{"en":"Headache, dry mouth, mild drowsiness in some people.","hi":"सिरदर्द, मुँह सूखना, कुछ लोगों में हल्की नींद।","kn":"ತಲೆನೋವು, ಬಾಯಿ ಒಣಗುವುದು, ಕೆಲವರಲ್ಲಿ ಸ್ವಲ್ಪ ನಿದ್ರೆ."},"d":{"en":"Adults: 10 mg once a day.","hi":"वयस्क: दिन में एक बार 10 मिग्रा।","kn":"ವಯಸ್ಕರು: ದಿನಕ್ಕೆ ಒಂದು ಬಾರಿ 10 ಮಿಗ್ರಾಂ."}},{"id":"fex","c":"8901000000073","n":"Fexofenadine 120/180 mg","e":"🟠","rx":false,"u":{"en":"Allergy: sneezing, runny nose, itchy skin and hives.","hi":"एलर्जी: छींक, बहती नाक, खुजली और पित्ती।","kn":"ಅಲರ್ಜಿ: ಸೀನು, ಮೂಗು ಸೋರುವಿಕೆ, ತುರಿಕೆ ಮತ್ತು ದದ್ದು."},"s":{"en":"Headache, nausea, dizziness.","hi":"सिरदर्द, मिचली, चक्कर।","kn":"ತಲೆನೋವು, ವಾಕರಿಕೆ, ತಲೆಸುತ್ತು."},"d":{"en":"Adults: 120 or 180 mg once a day, as on the label. Do not take with fruit juice.","hi":"वयस्क: दिन में एक बार 120 या 180 मिग्रा, लेबल के अनुसार। फलों के रस के साथ न लें।","kn":"ವಯಸ್ಕರು: ದಿನಕ್ಕೆ ಒಂದು ಬಾರಿ 120 ಅಥವಾ 180 ಮಿಗ್ರಾಂ, ಲೇಬಲ್ ಪ್ರಕಾರ. ಹಣ್ಣಿನ ರಸದ ಜೊತೆ ಬೇಡ."}},{"id":"ant","c":"8901000000080","n":"Antacid (generic)","e":"⚪","rx":false,"u":{"en":"Quick relief of acidity and heartburn.","hi":"एसिडिटी और सीने की जलन से तुरंत राहत।","kn":"ಆಮ್ಲೀಯತೆ ಮತ್ತು ಎದೆ ಉರಿಗೆ ತಕ್ಷಣದ ಪರಿಹಾರ."},"s":{"en":"Constipation or loose stools depending on type. Can affect how other medicines are absorbed.","hi":"प्रकार के अनुसार कब्ज़ या दस्त। दूसरी दवाओं के अवशोषण पर असर।","kn":"ಪ್ರಕಾರದ ಪ್ರಕಾರ ಮಲಬದ್ಧತೆ ಅಥವಾ ಭೇದಿ. ಇತರ ಔಷಧಗಳ ಹೀರಿಕೆಗೆ ಪರಿಣಾಮ."},"d":{"en":"Take as per the label, usually after meals and at bedtime. Take other medicines at a different time unless told otherwise.","hi":"लेबल के अनुसार, आमतौर पर खाने के बाद और सोते समय। दूसरी दवाएँ अलग समय पर लें।","kn":"ಲೇಬಲ್ ಪ್ರಕಾರ, ಸಾಮಾನ್ಯವಾಗಿ ಊಟದ ನಂತರ ಮತ್ತು ಮಲಗುವ ಮುನ್ನ. ಇತರ ಔಷಧಗಳನ್ನು ಬೇರೆ ಸಮಯದಲ್ಲಿ ಸೇವಿಸಿ."}},{"id":"fam","c":"8901000000087","n":"Famotidine 20 mg","e":"🔵","rx":false,"u":{"en":"Acidity, heartburn and stomach ulcers.","hi":"एसिडिटी, सीने की जलन और पेट के छाले।","kn":"ಆಮ್ಲೀಯತೆ, ಎದೆ ಉರಿ ಮತ್ತು ಹೊಟ್ಟೆ ಹುಣ್ಣು."},"s":{"en":"Headache, dizziness, constipation or loose stools.","hi":"सिरदर्द, चक्कर, कब्ज़ या दस्त।","kn":"ತಲೆನೋವು, ತಲೆಸುತ್ತು, ಮಲಬದ್ಧತೆ ಅಥವಾ ಭೇದಿ."},"d":{"en":"Adults: usually 20 mg once or twice a day. People with kidney problems need a doctor's advice.","hi":"वयस्क: आमतौर पर दिन में 1 या 2 बार 20 मिग्रा। किडनी की समस्या में डॉक्टर की सलाह ज़रूरी।","kn":"ವಯಸ್ಕರು: ಸಾಮಾನ್ಯವಾಗಿ ದಿನಕ್ಕೆ 1 ಅಥವಾ 2 ಬಾರಿ 20 ಮಿಗ್ರಾಂ. ಕಿಡ್ನಿ ಸಮಸ್ಯೆ ಇದ್ದರೆ ವೈದ್ಯರ ಸಲಹೆ ಅಗತ್ಯ."}},{"id":"ome","c":"8901000000094","n":"Omeprazole 20 mg","e":"🔴","rx":false,"u":{"en":"Acidity, heartburn and stomach ulcers.","hi":"एसिडिटी, सीने की जलन और पेट के छाले।","kn":"ಆಮ್ಲೀಯತೆ, ಎದೆ ಉರಿ ಮತ್ತು ಹೊಟ್ಟೆ ಹುಣ್ಣು."},"s":{"en":"Headache, stomach upset. Long use may lower magnesium and vitamin B12.","hi":"सिरदर्द, पेट की गड़बड़ी। लंबे उपयोग से मैग्नीशियम और विटामिन B12 घट सकता है।","kn":"ತಲೆನೋವು, ಹೊಟ್ಟೆ ಕಿರಿಕಿರಿ. ದೀರ್ಘಕಾಲ ಬಳಸಿದರೆ ಮ್ಯಾಗ್ನೀಷಿಯಂ ಮತ್ತು ವಿಟಮಿನ್ B12 ಕಡಿಮೆಯಾಗಬಹುದು."},"d":{"en":"Adults: 20 mg once a day, 30 to 60 minutes before breakfast, or as your doctor says.","hi":"वयस्क: दिन में एक बार 20 मिग्रा, नाश्ते से 30 से 60 मिनट पहले, या डॉक्टर के अनुसार।","kn":"ವಯಸ್ಕರು: ತಿಂಡಿಗೆ 30–60 ನಿಮಿಷ ಮೊದಲು ದಿನಕ್ಕೆ ಒಂದು ಬಾರಿ 20 ಮಿಗ್ರಾಂ, ಅಥವಾ ವೈದ್ಯರ ಸೂಚನೆಯಂತೆ."}},{"id":"ors","c":"8901000000101","n":"ORS (oral rehydration salts)","e":"🥤","rx":false,"u":{"en":"Replaces water and salts lost in diarrhea or vomiting.","hi":"दस्त या उल्टी में खोए पानी और नमक की पूर्ति।","kn":"ಭೇದಿ ಅಥವಾ ವಾಂತಿಯಲ್ಲಿ ಕಳೆದ ನೀರು ಮತ್ತು ಲವಣಗಳ ಪೂರೈಕೆ."},"s":{"en":"Vomiting if drunk too fast. Wrong water amount makes it less safe.","hi":"बहुत जल्दी पीने पर उल्टी। पानी की मात्रा गलत होने पर कम सुरक्षित।","kn":"ಬೇಗ ಕುಡಿದರೆ ವಾಂತಿ. ನೀರಿನ ಪ್ರಮಾಣ ತಪ್ಪಿದರೆ ಕಡಿಮೆ ಸುರಕ್ಷಿತ."},"d":{"en":"Mix one packet in exactly the water amount printed on it. Sip after each loose stool. See a doctor if diarrhea lasts over 2 days, or sooner for babies, elders, blood in stool or high fever.","hi":"एक पैकेट को उस पर लिखी पानी की सही मात्रा में घोलें। हर पतले दस्त के बाद घूँट-घूँट पिएँ। दस्त 2 दिन से ज़्यादा चले, या शिशु, बुज़ुर्ग, मल में खून या तेज़ बुखार हो तो डॉक्टर को दिखाएँ।","kn":"ಒಂದು ಪ್ಯಾಕೆಟ್ ಅನ್ನು ಅದರ ಮೇಲೆ ಬರೆದ ನೀರಿನ ಪ್ರಮಾಣದಲ್ಲಿ ಕರಗಿಸಿ. ಪ್ರತಿ ಭೇದಿಯ ನಂತರ ಗುಟುಕು ಗುಟುಕಾಗಿ ಕುಡಿಯಿರಿ. ಭೇದಿ 2 ದಿನಕ್ಕಿಂತ ಹೆಚ್ಚು ಇದ್ದರೆ, ಅಥವಾ ಶಿಶು, ವೃದ್ಧರು, ಮಲದಲ್ಲಿ ರಕ್ತ ಅಥವಾ ಹೆಚ್ಚು ಜ್ವರ ಇದ್ದರೆ ವೈದ್ಯರನ್ನು ಕಾಣಿ."}},{"id":"zin","c":"8901000000108","n":"Zinc (for children's diarrhea)","e":"🟢","rx":false,"u":{"en":"Given with ORS to children with diarrhea to shorten it.","hi":"बच्चों के दस्त में ORS के साथ, दस्त जल्दी ठीक करने के लिए।","kn":"ಮಕ್ಕಳ ಭೇದಿಯಲ್ಲಿ ORS ಜೊತೆ, ಬೇಗ ಗುಣವಾಗಲು."},"s":{"en":"Nausea or stomach upset.","hi":"मिचली या पेट की गड़बड़ी।","kn":"ವಾಕರಿಕೆ ಅಥವಾ ಹೊಟ್ಟೆ ಕಿರಿಕಿರಿ."},"d":{"en":"Dose depends on the child's age and is usually given for 10 to 14 days. Follow a doctor's advice.","hi":"खुराक बच्चे की उम्र पर निर्भर है, आमतौर पर 10 से 14 दिन। डॉक्टर की सलाह मानें।","kn":"ಪ್ರಮಾಣ ಮಗುವಿನ ವಯಸ್ಸಿಗೆ ಅನುಗುಣ, ಸಾಮಾನ್ಯವಾಗಿ 10–14 ದಿನ. ವೈದ್ಯರ ಸಲಹೆ ಪಾಲಿಸಿ."}},{"id":"isa","c":"8901000000115","n":"Psyllium (isabgol)","e":"🥄","rx":false,"u":{"en":"Constipation. Adds bulk and softness to stool.","hi":"कब्ज़। मल को मुलायम और भारी बनाता है।","kn":"ಮಲಬದ್ಧತೆ. ಮಲವನ್ನು ಮೃದು ಮತ್ತು ಭಾರವಾಗಿಸುತ್ತದೆ."},"s":{"en":"Gas and bloating. Can cause choking if taken dry.","hi":"गैस, पेट फूलना। सूखा लेने पर गले में अटकने का खतरा।","kn":"ಗ್ಯಾಸ್, ಹೊಟ್ಟೆ ಉಬ್ಬರ. ಒಣಗಿ ತೆಗೆದುಕೊಂಡರೆ ಗಂಟಲಲ್ಲಿ ಸಿಲುಕುವ ಅಪಾಯ."},"d":{"en":"Mix in a full glass of water, drink at once, and drink plenty of fluids through the day. Follow the label.","hi":"एक पूरे गिलास पानी में मिलाकर तुरंत पिएँ और दिन भर खूब पानी पिएँ। लेबल देखें।","kn":"ಒಂದು ಪೂರ್ಣ ಲೋಟ ನೀರಿನಲ್ಲಿ ಬೆರೆಸಿ ತಕ್ಷಣ ಕುಡಿಯಿರಿ ಮತ್ತು ದಿನವಿಡೀ ಸಾಕಷ್ಟು ನೀರು ಕುಡಿಯಿರಿ. ಲೇಬಲ್ ನೋಡಿ."}},{"id":"lac","c":"8901000000122","n":"Lactulose","e":"🟣","rx":false,"u":{"en":"Constipation.","hi":"कब्ज़।","kn":"ಮಲಬದ್ಧತೆ."},"s":{"en":"Gas, bloating, loose stools.","hi":"गैस, पेट फूलना, पतला मल।","kn":"ಗ್ಯಾಸ್, ಹೊಟ್ಟೆ ಉಬ್ಬರ, ತೆಳು ಮಲ."},"d":{"en":"As on the label or as your doctor says. It can take 1 to 2 days to work.","hi":"लेबल या डॉक्टर के अनुसार। असर में 1 से 2 दिन लग सकते हैं।","kn":"ಲೇಬಲ್ ಅಥವಾ ವೈದ್ಯರ ಪ್ರಕಾರ. ಪರಿಣಾಮಕ್ಕೆ 1–2 ದಿನ ಬೇಕಾಗಬಹುದು."}},{"id":"peg","c":"8901000000129","n":"Polyethylene glycol (PEG)","e":"🟤","rx":false,"u":{"en":"Constipation.","hi":"कब्ज़।","kn":"ಮಲಬದ್ಧತೆ."},"s":{"en":"Bloating, nausea, loose stools.","hi":"पेट फूलना, मिचली, पतला मल।","kn":"ಹೊಟ್ಟೆ ಉಬ್ಬರ, ವಾಕರಿಕೆ, ತೆಳು ಮಲ."},"d":{"en":"Dissolve the powder in water as on the label. Stop if you get diarrhea.","hi":"लेबल के अनुसार पाउडर पानी में घोलें। दस्त होने पर बंद करें।","kn":"ಲೇಬಲ್ ಪ್ರಕಾರ ಪುಡಿಯನ್ನು ನೀರಿನಲ್ಲಿ ಕರಗಿಸಿ. ಭೇದಿ ಆದರೆ ನಿಲ್ಲಿಸಿ."}},{"id":"ond","c":"8901000000136","n":"Ondansetron 4 mg","e":"🟡","rx":true,"u":{"en":"Prevents and treats nausea and vomiting.","hi":"मिचली और उल्टी रोकना व ठीक करना।","kn":"ವಾಕರಿಕೆ ಮತ್ತು ವಾಂತಿ ತಡೆ ಮತ್ತು ಚಿಕಿತ್ಸೆ."},"s":{"en":"Headache, constipation, tiredness. Can affect heart rhythm.","hi":"सिरदर्द, कब्ज़, थकान। दिल की धड़कन पर असर संभव।","kn":"ತಲೆನೋವು, ಮಲಬದ್ಧತೆ, ಆಯಾಸ. ಹೃದಯದ ಲಯದ ಮೇಲೆ ಪರಿಣಾಮ ಸಾಧ್ಯ."},"d":{"en":"Only as prescribed by your doctor. Do not stop suddenly without advice.","hi":"केवल डॉक्टर के कहने पर लें। अचानक बंद न करें।","kn":"ವೈದ್ಯರ ಸೂಚನೆಯಂತೆ ಮಾತ್ರ ಬಳಸಿ. ಇದ್ದಕ್ಕಿದ್ದಂತೆ ನಿಲ್ಲಿಸಬೇಡಿ."}},{"id":"met2","c":"8901000000143","n":"Metoclopramide 10 mg","e":"🟠","rx":true,"u":{"en":"Nausea, vomiting and slow stomach emptying.","hi":"मिचली, उल्टी और पेट देर से खाली होना।","kn":"ವಾಕರಿಕೆ, ವಾಂತಿ ಮತ್ತು ಹೊಟ್ಟೆ ನಿಧಾನವಾಗಿ ಖಾಲಿಯಾಗುವುದು."},"s":{"en":"Drowsiness, restlessness. Rarely abnormal muscle movements that need urgent care. Not for long-term use.","hi":"नींद, बेचैनी। कभी-कभी असामान्य मांसपेशी हरकतें जिनमें तुरंत इलाज चाहिए। लंबे समय के लिए नहीं।","kn":"ನಿದ್ರೆ, ಚಡಪಡಿಕೆ. ಅಪರೂಪಕ್ಕೆ ಅಸಹಜ ಸ್ನಾಯು ಚಲನೆ, ತಕ್ಷಣ ಚಿಕಿತ್ಸೆ ಬೇಕು. ದೀರ್ಘಕಾಲಕ್ಕೆ ಅಲ್ಲ."},"d":{"en":"Only as prescribed, for short courses.","hi":"केवल डॉक्टर के कहने पर, थोड़े समय के लिए।","kn":"ವೈದ್ಯರ ಸೂಚನೆಯಂತೆ ಮಾತ್ರ, ಅಲ್ಪಕಾಲ."}},{"id":"dex","c":"8901000000150","n":"Dextromethorphan (cough syrup)","e":"🧴","rx":false,"u":{"en":"Dry, irritating cough.","hi":"सूखी, परेशान करने वाली खाँसी।","kn":"ಒಣ, ಕಿರಿಕಿರಿ ಉಂಟುಮಾಡುವ ಕೆಮ್ಮು."},"s":{"en":"Drowsiness, dizziness. Dangerous with some antidepressants.","hi":"नींद, चक्कर। कुछ अवसाद-रोधी दवाओं के साथ खतरनाक।","kn":"ನಿದ್ರೆ, ತಲೆಸುತ್ತು. ಕೆಲವು ಖಿನ್ನತೆ ಔಷಧಗಳ ಜೊತೆ ಅಪಾಯಕಾರಿ."},"d":{"en":"Follow the label for age. Not for young children unless a doctor advises.","hi":"उम्र के अनुसार लेबल देखें। छोटे बच्चों को डॉक्टर की सलाह के बिना न दें।","kn":"ವಯಸ್ಸಿಗೆ ತಕ್ಕಂತೆ ಲೇಬಲ್ ನೋಡಿ. ಸಣ್ಣ ಮಕ್ಕಳಿಗೆ ವೈದ್ಯರ ಸಲಹೆ ಇಲ್ಲದೆ ಕೊಡಬೇಡಿ."}},{"id":"gua","c":"8901000000157","n":"Guaifenesin (expectorant)","e":"🧴","rx":false,"u":{"en":"Loosens thick mucus in a chesty cough.","hi":"बलगम वाली खाँसी में गाढ़ा बलगम ढीला करता है।","kn":"ಕಫದ ಕೆಮ್ಮಿನಲ್ಲಿ ದಪ್ಪ ಕಫವನ್ನು ಸಡಿಲಗೊಳಿಸುತ್ತದೆ."},"s":{"en":"Nausea, stomach upset.","hi":"मिचली, पेट की गड़बड़ी।","kn":"ವಾಕರಿಕೆ, ಹೊಟ್ಟೆ ಕಿರಿಕಿರಿ."},"d":{"en":"Follow the label and drink plenty of water.","hi":"लेबल के अनुसार लें और खूब पानी पिएँ।","kn":"ಲೇಬಲ್ ಪ್ರಕಾರ ಬಳಸಿ ಮತ್ತು ಸಾಕಷ್ಟು ನೀರು ಕುಡಿಯಿರಿ."}},{"id":"sal","c":"8901000000164","n":"Saline nasal spray","e":"👃","rx":false,"u":{"en":"Relieves a blocked nose. Safe for frequent use.","hi":"बंद नाक से राहत। बार-बार इस्तेमाल सुरक्षित।","kn":"ಮೂಗು ಕಟ್ಟುವಿಕೆಗೆ ಪರಿಹಾರ. ಪದೇ ಪದೇ ಬಳಸಲು ಸುರಕ್ಷಿತ."},"s":{"en":"Mild nose irritation.","hi":"नाक में हल्की जलन।","kn":"ಮೂಗಿನಲ್ಲಿ ಸ್ವಲ್ಪ ಕಿರಿಕಿರಿ."},"d":{"en":"1 to 2 sprays in each nostril as needed.","hi":"ज़रूरत होने पर हर नथुने में 1 से 2 स्प्रे।","kn":"ಅಗತ್ಯವಿದ್ದಾಗ ಪ್ರತಿ ಮೂಗಿನ ಹೊಳ್ಳೆಗೆ 1–2 ಸ್ಪ್ರೇ."}},{"id":"clo","c":"8901000000171","n":"Clotrimazole cream","e":"🧴","rx":false,"u":{"en":"Fungal skin infections such as ringworm and athlete's foot.","hi":"त्वचा के फंगल संक्रमण जैसे दाद और एथलीट फुट।","kn":"ಕಜ್ಜಿ ಮತ್ತು ಅಥ್ಲೀಟ್ಸ್ ಫುಟ್‌ನಂತಹ ಚರ್ಮದ ಶಿಲೀಂಧ್ರ ಸೋಂಕು."},"s":{"en":"Mild burning or redness.","hi":"हल्की जलन या लालिमा।","kn":"ಸ್ವಲ್ಪ ಉರಿ ಅಥವಾ ಕೆಂಪು."},"d":{"en":"Apply a thin layer to clean, dry skin 2 to 3 times a day. Continue for the time on the label even if the skin looks better.","hi":"साफ, सूखी त्वचा पर दिन में 2 से 3 बार पतली परत लगाएँ। त्वचा ठीक दिखे तब भी लेबल में लिखे समय तक लगाएँ।","kn":"ಸ್ವಚ್ಛ, ಒಣ ಚರ್ಮದ ಮೇಲೆ ದಿನಕ್ಕೆ 2–3 ಬಾರಿ ತೆಳುವಾಗಿ ಹಚ್ಚಿ. ಚರ್ಮ ಗುಣವಾದಂತೆ ಕಂಡರೂ ಲೇಬಲ್‌ನಲ್ಲಿರುವ ಅವಧಿವರೆಗೆ ಮುಂದುವರಿಸಿ."}},{"id":"ter","c":"8901000000178","n":"Terbinafine","e":"🧴","rx":false,"u":{"en":"Fungal infections of skin ಥೆಯಲ್ಲಿ ಬೇಡ. ತುಟಿ ಅಥವಾ ಮುಖ ಊತಕ್ಕೆ ತಕ್ಷಣ ಚಿಕಿತ್ಸೆ."},"d":{"en":"Only as prescribed. Do not stop suddenly.","hi":"केवल डॉक्टर के कहने पर लें। अचानक बंद न करें।","kn":"ವೈದ್ಯರ ಸೂಚನೆಯಂತೆ ಮಾತ್ರ ಬಳಸಿ. ಇದ್ದಕ್ಕಿದ್ದಂತೆ ನಿಲ್ಲಿಸಬೇಡಿ."}},{"id":"mtf","c":"8901000000241","n":"Metformin 500 mg","e":"🟡","rx":true,"u":{"en":"Type 2 diabetes.","hi":"टाइप 2 मधुमेह।","kn":"ಟೈಪ್ 2 ಮಧುಮೇಹ."},"s":{"en":"Nausea, loose stools, metallic taste. Rarely a serious acid build-up in the blood.","hi":"मिचली, पतला मल, मुँह में धातु जैसा स्वाद। कभी-कभी खून में एसिड बनना।","kn":"ವಾಕರಿಕೆ, ತೆಳು ಮಲ, ಬಾಯಲ್ಲಿ ಲೋಹದ ರುಚಿ. ಅಪರೂಪಕ್ಕೆ ರಕ್ತದಲ್ಲಿ ಆಮ್ಲ ಹೆಚ್ಚಳ."},"d":{"en":"Only as prescribed, usually with or after meals.","hi":"केवल डॉक्टर के कहने पर, आमतौर पर खाने के साथ या बाद में।","kn":"ವೈದ್ಯರ ಸೂಚನೆಯಂತೆ ಮಾತ್ರ, ಸಾಮಾನ್ಯವಾಗಿ ಊಟದ ಜೊತೆ ಅಥವಾ ನಂತರ."}},{"id":"ins","c":"8901000000248","n":"Insulin","e":"💉","rx":true,"u":{"en":"Controls blood sugar in diabetes.","hi":"मधुमेह में रक्त शर्करा नियंत्रित करता है।","kn":"ಮಧುಮೇಹದಲ್ಲಿ ರಕ್ತದ ಸಕ್ಕರೆ ನಿಯಂತ್ರಿಸುತ್ತದೆ."},"s":{"en":"Low blood sugar (sweating, shaking, confusion). Keep a sugar source handy.","hi":"शुगर कम होना (पसीना, काँपना, भ्रम)। चीनी पास रखें।","kn":"ಸಕ್ಕರೆ ಕಡಿಮೆಯಾಗುವುದು (ಬೆವರು, ನಡುಕ, ಗೊಂದಲ). ಸಕ್ಕರೆ ಹತ್ತಿರ ಇಡಿ."},"d":{"en":"Type and dose are set by your doctor. Store unopened insulin in a fridge. Do not freeze.","hi":"प्रकार और खुराक डॉक्टर तय करते हैं। न खुला इंसुलिन फ्रिज में रखें, जमाएँ नहीं।","kn":"ಬಗೆ ಮತ್ತು ಪ್ರಮಾಣವನ್ನು ವೈದ್ಯರು ನಿರ್ಧರಿಸುತ್ತಾರೆ. ತೆರೆಯದ ಇನ್ಸುಲಿನ್ ಅನ್ನು ಫ್ರಿಜ್‌ನಲ್ಲಿ ಇಡಿ, ಹೆಪ್ಪುಗಟ್ಟಿಸಬೇಡಿ."}},{"id":"ato","c":"8901000000255","n":"Atorvastatin 10 mg","e":"🟠","rx":true,"u":{"en":"Lowers cholesterol and the risk of heart attack.","hi":"कोलेस्ट्रॉल कम करता है और हार्ट अटैक का जोखिम घटाता है।","kn":"ಕೊಲೆಸ್ಟ್ರಾಲ್ ಕಡಿಮೆ ಮಾಡಿ ಹೃದಯಾಘಾತದ ಅಪಾಯ ತಗ್ಗಿಸುತ್ತದೆ."},"s":{"en":"Muscle pain, stomach upset. Report severe unexplained muscle pain or dark urine.","hi":"मांसपेशियों में दर्द, पेट की गड़बड़ी। बहुत तेज़ दर्द या गहरे रंग का पेशाब हो तो बताएँ।","kn":"ಸ್ನಾಯು ನೋವು, ಹೊಟ್ಟೆ ಕಿರಿಕಿರಿ. ತೀವ್ರ ನೋವು ಅಥವಾ ಗಾಢ ಮೂತ್ರ ಇದ್ದರೆ ತಿಳಿಸಿ."},"d":{"en":"Usually once a day, as prescribed.","hi":"आमतौर पर दिन में एक बार, डॉक्टर के अनुसार।","kn":"ಸಾಮಾನ್ಯವಾಗಿ ದಿನಕ್ಕೆ ಒಂದು ಬಾರಿ, ವೈದ್ಯರ ಸೂಚನೆಯಂತೆ."}},{"id":"ros","c":"8901000000262","n":"Rosuvastatin 10 mg","e":"⚪","rx":true,"u":{"en":"Lowers cholesterol and the risk of heart attack.","hi":"कोलेस्ट्रॉल कम करता है और हार्ट अटैक का जोखिम घटाता है।","kn":"ಕೊಲೆಸ್ಟ್ರಾಲ್ ಕಡಿಮೆ ಮಾಡಿ ಹೃದಯಾಘಾತದ ಅಪಾಯ ತಗ್ಗಿಸುತ್ತದೆ."},"s":{"en":"Muscle pain, stomach upset. Report severe unexplained muscle pain or dark urine.","hi":"मांसपेशियों में दर्द, पेट की गड़बड़ी। बहुत तेज़ दर्द या गहरे रंग का पेशाब हो तो बताएँ।","kn":"ಸ್ನಾಯು ನೋವು, ಹೊಟ್ಟೆ ಕಿರಿಕಿರಿ. ತೀವ್ರ ನೋವು ಅಥವಾ ಗಾಢ ಮೂತ್ರ ಇದ್ದರೆ ತಿಳಿಸಿ."},"d":{"en":"Usually once a day, as prescribed.","hi":"आमतौर पर दिन में एक बार, डॉक्टर के अनुसार।","kn":"ಸಾಮಾನ್ಯವಾಗಿ ದಿನಕ್ಕೆ ಒಂದು ಬಾರಿ, ವೈದ್ಯರ ಸೂಚನೆಯಂತೆ."}},{"id":"clp","c":"8901000000269","n":"Clopidogrel 75 mg","e":"🔵","rx":true,"u":{"en":"Prevents blood clots after a heart attack, stent or stroke.","hi":"हार्ट अटैक, स्टेंट या स्ट्रोक के बाद खून के थक्के रोकता है।","kn":"ಹೃದಯಾಘಾತ, ಸ್ಟೆಂಟ್ ಅಥವಾ ಪಾರ್ಶ್ವವಾಯುವಿನ ನಂತರ ರಕ್ತ ಹೆಪ್ಪುಗಟ್ಟುವುದನ್ನು ತಡೆಯುತ್ತದೆ."},"s":{"en":"Bleeding, easy bruising.","hi":"खून बहना, आसानी से नील पड़ना।","kn":"ರಕ್ತಸ್ರಾವ, ಸುಲಭವಾಗಿ ಬಾಸುಂಡೆ."},"d":{"en":"Only as prescribed. Never stop on your own, especially after a stent.","hi":"केवल डॉक्टर के कहने पर। खुद बंद न करें, खासकर स्टेंट के बाद।","kn":"ವೈದ್ಯರ ಸೂಚನೆಯಂತೆ ಮಾತ್ರ. ನೀವಾಗಿಯೇ ನಿಲ್ಲಿಸಬೇಡಿ, ವಿಶೇಷವಾಗಿ ಸ್ಟೆಂಟ್ ನಂತರ."}},{"id":"lev","c":"8901000000276","n":"Levothyroxine","e":"🔴","rx":true,"u":{"en":"Replaces thyroid hormone in an underactive thyroid.","hi":"कम सक्रिय थायरॉइड में थायरॉइड हार्मोन की पूर्ति।","kn":"ಕಡಿಮೆ ಥೈರಾಯ್ಡ್‌ನಲ್ಲಿ ಥೈರಾಯ್ಡ್ ಹಾರ್ಮೋನ್ ಪೂರೈಕೆ."},"s":{"en":"Too much causes palpitations, anxiety, weight loss.","hi":"ज़्यादा होने पर धड़कन तेज़, घबराहट, वज़न घटना।","kn":"ಹೆಚ್ಚಾದರೆ ಹೃದಯ ಬಡಿತ ಹೆಚ್ಚು, ಆತಂಕ, ತೂಕ ಇಳಿಕೆ."},"d":{"en":"Once a day on an empty stomach, 30 to 60 minutes before breakfast, at the same time each day. Dose is set from blood tests.","hi":"दिन में एक बार खाली पेट, नाश्ते से 30 से 60 मिनट पहले, रोज़ एक ही समय पर। खुराक खून की जाँच से तय होती है।","kn":"ದಿನಕ್ಕೆ ಒಂದು ಬಾರಿ ಖಾಲಿ ಹೊಟ್ಟೆಯಲ್ಲಿ, ತಿಂಡಿಗೆ 30–60 ನಿಮಿಷ ಮೊದಲು, ಪ್ರತಿದಿನ ಒಂದೇ ಸಮಯದಲ್ಲಿ. ಪ್ರಮಾಣ ರಕ್ತ ಪರೀಕ್ಷೆಯಿಂದ ನಿರ್ಧಾರ."}},{"id":"fer","c":"8901000000283","n":"Ferrous sulfate (iron)","e":"🟢","rx":false,"u":{"en":"Treats iron deficiency.","hi":"आयरन की कमी का इलाज।","kn":"ಕಬ್ಬಿಣದ ಕೊರತೆಯ ಚಿಕಿತ್ಸೆ."},"s":{"en":"Dark stools, constipation, nausea. Overdose is dangerous for children: keep out of reach.","hi":"गहरे रंग का मल, कब्ज़, मिचली। बच्चों के लिए अधिक मात्रा खतरनाक: पहुँच से दूर रखें।","kn":"ಗಾಢ ಬಣ್ಣದ ಮಲ, ಮಲಬದ್ಧತೆ, ವಾಕರಿಕೆ. ಮಕ್ಕಳಿಗೆ ಹೆಚ್ಚು ಪ್ರಮಾಣ ಅಪಾಯಕಾರಿ: ಕೈಗೆ ಸಿಗದಂತೆ ಇಡಿ."},"d":{"en":"As on the label or as your doctor says. Best absorbed on an empty stomach, or with food if it upsets you.","hi":"लेबल या डॉक्टर के अनुसार। खाली पेट बेहतर अवशोषण; पेट खराब हो तो खाने के साथ लें।","kn":"ಲೇಬಲ್ ಅಥವಾ ವೈದ್ಯರ ಪ್ರಕಾರ. ಖಾಲಿ ಹೊಟ್ಟೆಯಲ್ಲಿ ಉತ್ತಮ ಹೀರಿಕೆ; ಹೊಟ್ಟೆ ಕೆಟ್ಟರೆ ಊಟದ ಜೊತೆ ಸೇವಿಸಿ."}},{"id":"cya","c":"8901000000290","n":"Cyanocobalamin (vitamin B12)","e":"🟣","rx":false,"u":{"en":"Treats vitamin B12 deficiency.","hi":"विटामिन B12 की कमी का इलाज।","kn":"ವಿಟಮಿನ್ B12 ಕೊರತೆಯ ಚಿಕಿತ್ಸೆ."},"s":{"en":"Usually well tolerated. Rarely itching or mild diarrhea.","hi":"आमतौर पर ठीक सहन होती है। कभी-कभी खुजली या हल्का दस्त।","kn":"ಸಾಮಾನ್ಯವಾಗಿ ಚೆನ್ನಾಗಿ ಸಹಿಸಲ್ಪಡುತ್ತದೆ. ಅಪರೂಪಕ್ಕೆ ತುರಿಕೆ ಅಥವಾ ಸ್ವಲ್ಪ ಭೇದಿ."},"d":{"en":"As on the label or as your doctor says. Tablets or injections.","hi":"लेबल या डॉक्टर के अनुसार। गोली या इंजेक्शन।","kn":"ಲೇಬಲ್ ಅಥವಾ ವೈದ್ಯರ ಪ್ರಕಾರ. ಮಾತ್ರೆ ಅಥವಾ ಚುಚ್ಚುಮದ್ದು."}},{"id":"mec","c":"8901000000297","n":"Methylcobalamin (vitamin B12)","e":"🟤","rx":false,"u":{"en":"Treats vitamin B12 deficiency and some nerve symptoms.","hi":"विटामिन B12 की कमी और कुछ नस संबंधी लक्षणों का इलाज।","kn":"ವಿಟಮಿನ್ B12 ಕೊರತೆ ಮತ್ತು ಕೆಲವು ನರ ಲಕ್ಷಣಗಳ ಚಿಕಿತ್ಸೆ."},"s":{"en":"Usually well tolera const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const clip=(s,n=380)=>{s=String(s).replace(/\s+/g," ").replace(/^[\d.\s]*(INDICATIONS\s*(AND|&)\s*USAGE|ADVERSE REACTIONS|DOSAGE\s*(AND|&)\s*ADMINISTRATION|WARNINGS|PURPOSE|Uses)[:\s]*/i,"").trim();if(s.length<=n)return s;const c=s.slice(0,n),i=c.lastIndexOf(". ");return(i>n*.4?c.slice(0,i+1):c)+" …"};
const GEN={paracetamol:"acetaminophen",salbutamol:"albuterol",isabgol:"psyllium"};          // international name -> US name
const WK={ors:"Oral rehydration therapy","saline nasal":"Nasal irrigation",antacid:"Antacid"}; // Wikipedia page titles
const key=n=>n.toLowerCase().replace(/\(.*?\)/g,"").replace(/\b(inhaler|cream|spray|syrup)\b/g,"").replace(/\s\d.*$/,"").replace(/\s+/g," ").trim();
async function jf(u){const c=new AbortController(),tm=setTimeout(()=>c.abort(),8000);
 try{const r=await fetch(u,{signal:c.signal});return r.ok?await r.json():null}catch(e){return null}finally{clearTimeout(tm)}}
async function fda(k){const g=GEN[k]||k,base="https://api.fda.gov/drug/label.json?limit=1&search=";
 let j=await jf(base+encodeURIComponent('openfda.generic_name:"'+g+'"'));
 if(!j||!j.results)j=await jf(base+encodeURIComponent('openfda.brand_name:"'+g+'"'));
 const r=j&&j.results&&j.results[0];if(!r)return null;
 const f=a=>a&&a[0]?clip(a[0]):"";
 return{u:f(r.indications_and_usage||r.purpose),s:f(r.adverse_reactions||r.warnings),d:f(r.dosage_and_administration),
  rx:/PRESCRIPTION/i.test(((r.openfda&&r.openfda.product_type)||[]).join())}}
async function wiki(k){const ti=WK[k]||cap(k);
 const j=await jf("https://en.wikipedia.org/api/rest_v1/page/summary/"+encodeURIComponent(ti));
 if(!j||j.type==="disambiguation"||!j.extract)return null;
 return{img:j.thumbnail&&j.thumbnail.source,txt:j.extract,url:j.content_urls&&j.content_urls.desktop&&j.content_urls.desktop.page}}
let recent=[],onl=null,reqId=0,expV="";
try{recent=JSON.parse(localStorage.getItem("ms_recent")||"[]")}catch(e){}
function addRecent(m){recent=[{id:m.id,n:m.n,e:m.e,on:!!m.online,data:m.online?m:null},...recent.filter(x=>x.id!==m.id)].slice(0,10);
 try{localStorage.setItem("ms_recent",JSON.stringify(recent))}catch(e){}}
function clearRecent(){recent=[];try{localStorage.removeItem("ms_recent")}catch(e){}render()}
function show(m,w){cur=m;onl=w||null;msg="";expV="";tab=1;addRecent(m);render();$("#main").scrollTop=0;
 if(!m.online&&!w)wiki(key(m.n)).then(x=>{if(cur===m&&x){onl=x;render()}})}   // add the online image after the page is already shown
function openRecent(i){const e=recent[i];if(!e)return;const m=e.on?e.data:DB.find(x=>x.id===e.id);if(m){stopCam();show(m,null)}}
let L="en",tab=1,cur=null,saved=[],stream=null,timer=null,msg="";
try{saved=JSON.parse(localStorage.getItem("ms_saved")||"[]");L=localStorage.getItem("ms_lang")||"en"}catch(e){}
const $=s=>document.querySelector(s),t=k=>T[L][k];
const persist=()=>{try{localStorage.setItem("ms_saved",JSON.stringify(saved));localStorage.setItem("ms_lang",L)}catch(e){}};
function find(q){q=q.trim().toLowerCase();if(!q)return null;
 return DB.find(m=>m.c===q||m.id===q)||(q.length>=3?DB.find(m=>m.n.toLowerCase().startsWith(q)):null)||(q.length>=3?DB.find(m=>m.n.toLowerCase().includes(q)):null)||null}
async function look(q){stopCam();q=String(q||"").trim();if(!q)return;const id=++reqId;let m=null,useLocal=!API;
 if(API){try{const r=await fetch(API+"/api/medicines/lookup?q="+encodeURIComponent(q));
  if(r.ok)m=await r.json();else if(r.status!==404)throw new Error("server");}catch(e){useLocal=true}}
 if(useLocal)m=find(q);
 tab=1;
 if(m){show(m);return}
 if(/^\d{8,}$/.test(q)){cur=null;msg="unver";render();return}      // a code that is not in the database
 cur=null;onl=null;msg="loading";render();
 const k=key(q),[f,w]=await Promise.all([fda(k),wiki(k)]);          // not stored here: ask the US FDA label database + Wikipedia
 if(id!==reqId)return;
 if(!f){cur=null;msg="nf";render();return}
 show({id:"on:"+k,c:"",n:cap(k),e:"🔎",rx:f.rx,online:true,u:{en:f.u||"—"},s:{en:f.s||"—"},d:{en:f.d||"—"},img:w&&w.img},w)}
function ixFor(id,list){return IX.filter(x=>(x[0]===id&&list.includes(x[1]))||(x[1]===id&&list.includes(x[0])))}
function expStatus(v){if(!v)return"";const d=new Date(v),n=new Date(),s=new Date();s.setMonth(s.getMonth()+3);
 return d<n?`<div class="alert b">⛔ ${t("expired")}</div>`:d<s?`<div class="alert w">⚠️ ${t("soon")}</div>`:`<div class="alert o">✅ ${t("okexp")}</div>`}
function speak(){if(!cur||!("speechSynthesis"in window))return;speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(`${cur.n}. ${t("uses")}: ${g(cur.u)} ${t("side")}: ${g(cur.s)} ${t("dose")}: ${g(cur.d)}`);
 u.lang={en:"en-IN",hi:"hi-IN",kn:"kn-IN"}[L];speechSynthesis.speak(u)}
async function startCam(){
 if(!("BarcodeDetector"in window)||!navigator.mediaDevices){msg="nocam";render();return}
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});render();const v=$("#vid");v.srcObject=stream;await v.play();
  const det=new BarcodeDetector();timer=setInterval(async()=>{try{const r=await det.detect(v);if(r.length)look(r[0].rawValue)}catch(e){}},500)}
 catch(e){msg="nocam";stopCam();render()}}
function stopCam(){clearInterval(timer);if(stream){stream.getTracks().forEach(x=>x.stop());stream=null}}
function resultHTML(m){
 const sv=saved.includes(m.id),al=ixFor(m.id,saved.filter(i=>i!==m.id));
 const im=m.img||(onl&&onl.img),src=im&&/^https:\/\//.test(im)?im:"";
 return `<div class="top"><div class="pill">${m.e}</div><div><h2>${esc(m.n)}</h2><span class="mut">${m.online?"🌐 FDA / Wikipedia":"✔ "+t("verified")}</span></div></div>
 ${m.online?`<div class="alert w">🌐 ${t("onNote")}</div>`:""}
 ${src?`<div class="card" style="text-align:center"><img src="${esc(src)}" alt="${esc(m.n)}" referrerpolicy="no-referrer" style="max-width:100%;max-height:200px;object-fit:contain;border-radius:10px;background:#fff" onerror="this.parentNode.remove()"><p class="mut">${t("imgc")}</p></div>`:""}
 ${m.rx?`<div class="alert w">💊 ${t("rx")}</div>`:""}${(!m.online&&L!=="en"&&!m.u[L])?`<p class="mut">${t("enNote")}</p>`:""}
 ${al.map(a=>`<div class="alert b">⚠️ ${t("ix")}: ${esc(g(a[2]))}</div>`).join("")}
 <div class="card"><h3>${t("uses")}</h3><p>${esc(g(m.u))}</p></div>
 <div class="card"><h3>${t("side")}</h3><p>${esc(g(m.s))}</p></div>
 <div class="card"><h3>${t("dose")}</h3><p>${esc(g(m.d))}</p></div>
 <div class="card"><h3>${t("store")}</h3><p>${t("storeTxt")}</p></div>
 ${onl&&onl.txt?`<div class="card"><h3>${t("about")}</h3><p>${esc(clip(onl.txt,320))}</p>${onl.url?`<a style="color:var(--pri)" href="${esc(onl.url)}" target="_blank" rel="noopener">Wikipedia</a>`:""}</div>`:""}
 <div class="card"><h3>${t("expiry")}</h3><input type="date" id="exp" aria-label="${t("expiry")}"><div id="expres"></div></div>
 <div class="row"><button class="btn alt" onclick="speak()">🔊 ${t("speak")}</button>${m.online?"":`<button class="btn" onclick="toggleSave('${m.id}')">${sv?"✔ "+t("saved2"):t("save")}</button>`}</div>
 <p class="mut">${t("disc")}</p>`}

function toggleSave(id){if(!saved.includes(id))saved.push(id);persist();render()}
function render(){
 $("#t1").textContent=t("scan");$("#t2").textContent=t("saved")+(saved.length?` (${saved.length})`:"");
 $("#t1").className=tab==1?"on":"";$("#t2").className=tab==2?"on":"";document.documentElement.lang=L;
 let h="";
 if(tab==1){
  h+=`<button class="btn" onclick="${stream?"stopCam();render()":"startCam()"}">📷 ${stream?t("stop"):t("scanBtn")}</button>`;
  if(stream)h+=`<video id="vid" playsinline muted style="margin-top:10px"></video>`;
  h+=`<div class="row"><input id="q" placeholder="${t("ph")}" aria-label="${t("ph")}" onkeydown="if(event.key==='Enter')look(this.value)"><button class="btn" style="width:auto" onclick="look($('#q').value)">${t("go")}</button></div>`;
  if(msg==="nocam")h+=`<div class="alert w">${t("nocam")}</div>`;
  if(msg==="nf")h+=`<div class="alert w">${t("nf")}</div>`;
  if(msg==="unver")h+=`<div class="alert b">🚫 ${t("unver")}</div>`;
  if(msg==="loading")h+=`<div class="alert o">⏳ ${t("onl")}</div>`;
  if(cur)h+=resultHTML(cur);
  else if(msg!=="loading")h+=`<h3>${t("recent")}</h3>`+(recent.length?`<div class="chips">${recent.map((e,i)=>`<button class="chip" onclick="openRecent(${i})">${e.on?"🌐":e.e} ${esc(e.n)}</button>`).join("")}</div><button class="chip" onclick="clearRecent()">🗑 ${t("clear")}</button>`:`<p class="mut">${t("noRecent")}</p>`);
 }else{
  if(!saved.length)h+=`<p class="mut">${t("empty")}</p>`;
  else{const ms=saved.map(i=>DB.find(m=>m.id===i));
   const al=IX.filter(x=>saved.includes(x[0])&&saved.includes(x[1]));
   if(al.length)h+=`<h3>${t("warnHd")}</h3>`+al.map(a=>`<div class="alert b">⚠️ ${g(a[2])}</div>`).join("");
   h+=ms.map(m=>`<div class="card"><div class="top"><div class="pill" style="width:56px;height:56px;font-size:30px">${m.e}</div><div style="flex:1"><b>${m.n}</b><p class="mut">${g(m.u)}</p></div></div>
    <div class="row"><button class="btn alt" onclick="look('${m.c}')">${t("uses")}</button><button class="btn alt" onclick="saved=saved.filter(i=>i!=='${m.id}');persist();render()">${t("rm")}</button></div></div>`).join("")}
 }
 $("#main").innerHTML=h;
 const e=$("#exp");if(e){e.value=expV;e.onchange=()=>{expV=e.value;$("#expres").innerHTML=expStatus(expV)};if(expV)$("#expres").innerHTML=expStatus(expV)}
}
$("#lang").value=L;$("#lang").onchange=e=>{L=e.target.value;persist();render()};
$("#t1").onclick=()=>{stopCam();cur=null;msg="";tab=1;render()};$("#t2").onclick=()=>{stopCam();tab=2;render()};
render();
</script></body></html>
