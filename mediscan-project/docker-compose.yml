# Starts PostgreSQL and the API together:  docker compose up -d --build
# Then load the data once:                 docker compose run --rm api npm run seed
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mediscan
      POSTGRES_PASSWORD: mediscan
      POSTGRES_DB: mediscan
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediscan"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://mediscan:mediscan@db:5432/mediscan
      CORS_ORIGINS: "*"
      PORT: 3000
    ports: ["3000:3000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
